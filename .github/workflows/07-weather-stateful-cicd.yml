name: 07 Stateful Weather CI CD

on:
  push:
    paths:
      - "07_multi-agent-service-ops/00_runtime-and-deployment/06_weather-mcp-stateful-deployment/**"
      - ".github/workflows/07-weather-stateful-cicd.yml"
  pull_request:
    paths:
      - "07_multi-agent-service-ops/00_runtime-and-deployment/06_weather-mcp-stateful-deployment/**"
      - ".github/workflows/07-weather-stateful-cicd.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weather-stateful-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 07_multi-agent-service-ops/00_runtime-and-deployment/06_weather-mcp-stateful-deployment
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install and test with Fake stores
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt pytest
          cd backend
          python -m pytest test_app.py -q
      - name: Validate infrastructure and application Compose
        run: |
          docker compose -f compose.infrastructure.yml config --quiet
          docker compose -f compose.application.yml config --quiet
      - name: Build application images only
        run: docker compose -f compose.application.yml build

  deploy-application:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test-and-build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Configure verified SSH identity
        env:
          SSH_PRIVATE_KEY: ${{ secrets.AWS_SSH_PRIVATE_KEY }}
          AWS_SSH_KNOWN_HOSTS: ${{ secrets.AWS_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$AWS_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Copy application source
        env:
          AWS_HOST: ${{ secrets.AWS_HOST }}
          AWS_USER: ${{ secrets.AWS_USER }}
        run: |
          ssh "$AWS_USER@$AWS_HOST" 'mkdir -p ~/weather-stateful'
          scp -r 07_multi-agent-service-ops/00_runtime-and-deployment/06_weather-mcp-stateful-deployment/. "$AWS_USER@$AWS_HOST:~/weather-stateful/"
      - name: Deploy application without restarting infrastructure
        env:
          AWS_HOST: ${{ secrets.AWS_HOST }}
          AWS_USER: ${{ secrets.AWS_USER }}
        run: |
          ssh "$AWS_USER@$AWS_HOST" 'cd ~/weather-stateful && test -f .env && docker compose -f compose.application.yml config --quiet && docker compose -f compose.application.yml up -d --build --force-recreate weather-mcp backend frontend && curl --fail --retry 12 --retry-delay 5 http://127.0.0.1:8000/health/ready'
