name: 07 Runtime Deploy Example

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.AWS_SSH_PRIVATE_KEY }}
          AWS_HOST: ${{ secrets.AWS_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$AWS_HOST" >> ~/.ssh/known_hosts
      - name: Copy source to EC2
        env:
          AWS_HOST: ${{ secrets.AWS_HOST }}
          AWS_USER: ${{ secrets.AWS_USER }}
        run: |
          ssh "$AWS_USER@$AWS_HOST" 'mkdir -p ~/aidevs-runtime'
          scp -r 07_multi-agent-service-ops/00_runtime-and-deployment/01_simple-multi-llm-compose "$AWS_USER@$AWS_HOST:~/aidevs-runtime/"
      - name: Deploy and verify
        env:
          AWS_HOST: ${{ secrets.AWS_HOST }}
          AWS_USER: ${{ secrets.AWS_USER }}
        run: |
          ssh "$AWS_USER@$AWS_HOST" 'cd ~/aidevs-runtime/01_simple-multi-llm-compose && docker compose up -d --build && curl --fail --retry 12 --retry-delay 5 http://127.0.0.1:8200/health/live'
