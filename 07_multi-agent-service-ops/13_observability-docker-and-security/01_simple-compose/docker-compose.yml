services:
  backend:
    build: ./backend
    ports:
      - "8200:8200"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8200/health')"
      interval: 5s
      timeout: 3s
      retries: 10

  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8200
    ports:
      - "8503:8501"
    depends_on:
      backend:
        condition: service_healthy

